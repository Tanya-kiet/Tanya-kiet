<svg fill="none" viewBox="0 0 900 240" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pill-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="pill-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="pill-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="240" rx="16" fill="url(#bg-gradient)"/>
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Neural AI Constellation Mesh Background -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <path d="M 0,40 L 900,40 M 0,80 L 900,80 M 0,120 L 900,120 M 0,160 L 900,160 M 0,200 L 900,200" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 8"/>
    <path d="M 100,0 L 100,240 M 250,0 L 250,240 M 400,0 L 400,240 M 550,0 L 550,240 M 700,0 L 700,240 M 850,0 L 850,240" stroke="#334155" stroke-width="0.75" stroke-dasharray="4 8"/>
  </g>

  <!-- Decorative Glowing Nodes & Network Connections (Right Side) -->
  <g opacity="0.6">
    <!-- Lines -->
    <line x1="720" y1="50" x2="820" y2="90" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 4"/>
    <line x1="820" y1="90" x2="760" y2="160" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="760" y1="160" x2="850" y2="180" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="720" y1="50" x2="760" y2="160" stroke="#f472b6" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="650" y1="110" x2="720" y2="50" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="650" y1="110" x2="760" y2="160" stroke="#38bdf8" stroke-width="1"/>

    <!-- Nodes -->
    <circle cx="720" cy="50" r="5" fill="#38bdf8" filter="url(#subtle-glow)"/>
    <circle cx="820" cy="90" r="6" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="760" cy="160" r="5.5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="850" cy="180" r="4" fill="#f472b6" filter="url(#subtle-glow)"/>
    <circle cx="650" cy="110" r="4.5" fill="#6366f1" filter="url(#subtle-glow)"/>
  </g>

  <!-- Left Side Geometric Accents -->
  <g opacity="0.4">
    <circle cx="60" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="90" cy="80" r="3" fill="#818cf8"/>
    <line x1="60" y1="50" x2="90" y2="80" stroke="#6366f1" stroke-width="1"/>
    <line x1="90" y1="80" x2="50" y2="130" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="50" cy="130" r="2.5" fill="#c084fc"/>
  </g>

  <!-- Code Graphic Bracket Elements (Subtle) -->
  <text x="40" y="195" font-family="'Courier New', monospace" font-size="28" fill="#334155" opacity="0.5" font-weight="bold">&lt;/&gt;</text>
  <text x="830" y="60" font-family="'Courier New', monospace" font-size="24" fill="#334155" opacity="0.4" font-weight="bold">{ }</text>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="4" fill="url(#glow-line)"/>

  <!-- Main Content Header -->
  <!-- Name -->
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#title-gradient)" letter-spacing="0.5">
    Tanya Bhadana
  </text>

  <!-- Subtitle Headline -->
  <text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="0.3">
    AI/ML Explorer  <tspan fill="#818cf8">•</tspan>  Generative AI Enthusiast  <tspan fill="#818cf8">•</tspan>  Full Stack Developer
  </text>

  <!-- Tag Pills Container -->
  <g transform="translate(50, 148)">
    <!-- Pill 1: GenAI & RAG -->
    <g>
      <rect width="180" height="34" rx="17" fill="url(#pill-bg-1)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">
        🤖 Generative AI &amp; RAG
      </text>
    </g>

    <!-- Pill 2: NLP & Systems -->
    <g transform="translate(195, 0)">
      <rect width="185" height="34" rx="17" fill="url(#pill-bg-2)" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.6"/>
      <text x="92.5" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="middle">
        🧠 NLP &amp; Intelligent Systems
      </text>
    </g>

    <!-- Pill 3: Full Stack AI -->
    <g transform="translate(395, 0)">
      <rect width="175" height="34" rx="17" fill="url(#pill-bg-3)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
      <text x="87.5" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f0abfc" text-anchor="middle">
        💻 Full Stack Development
      </text>
    </g>
  </g>

  <!-- Bottom Glowing Accent Line -->
  <rect x="50" y="208" width="800" height="1" fill="url(#glow-line)" opacity="0.4"/>
</svg>
